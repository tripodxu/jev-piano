<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev 即兴钢琴 · 实时谱曲演奏</title>
  <meta name="description" content="Jev 每小节实时决策，边作曲边演奏的钢琴。可接 TypeSafe/OpenRouter/Workers AI，也可离线随机。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">Jev</span>
      <span class="brand-cn">即兴钢琴</span>
      <span class="brand-tag">每小节实时决策，边作曲边演奏</span>
    </div>
    <div id="statusBar" class="statusbar" title="Jev 渠道 / 累计 tokens / 累计费用 / 平均延迟">
      <span class="pill" id="stChannel">离线随机</span>
      <span class="pill" id="stTokens">0 tok</span>
      <span class="pill" id="stCost">$0.000000</span>
      <span class="pill" id="stLatency">— ms</span>
    </div>
    <button id="settingsBtn" class="iconbtn" type="button" aria-label="设置">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/><circle cx="10" cy="4" r="1.8" fill="currentColor" stroke="none"/><circle cx="5.5" cy="8" r="1.8" fill="currentColor" stroke="none"/><circle cx="11.5" cy="12" r="1.8" fill="currentColor" stroke="none"/></g></svg>
    </button>
  </header>

  <main>
    <section class="console reveal" style="--d:.05s">
      <div class="field-group">
        <label class="lbl" for="prompt">你的灵感</label>
        <textarea id="prompt" rows="3" placeholder="例：雨夜的城市，一个人走在霓虹下"></textarea>
      </div>

      <div class="field-group">
        <label class="lbl">风格</label>
        <div id="styleChips" class="chips" role="radiogroup">
          <button class="chip sel" data-style="random" type="button">随机</button>
          <button class="chip" data-style="classical" type="button">古典</button>
          <button class="chip" data-style="romantic" type="button">浪漫</button>
          <button class="chip" data-style="jazz" type="button">爵士</button>
          <button class="chip" data-style="pop" type="button">流行</button>
          <button class="chip" data-style="lofi" type="button">Lo-Fi</button>
          <button class="chip" data-style="newage" type="button">新世纪</button>
          <button class="chip" data-style="waltz" type="button">圆舞曲</button>
          <button class="chip" data-style="oriental" type="button">东方五声</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label class="lbl" for="goal">目标</label>
          <select id="goal">
            <option value="随机冒险" selected>随机冒险</option>
            <option value="放松助眠">放松助眠</option>
            <option value="专注陪伴">专注陪伴</option>
            <option value="情绪宣泄">情绪宣泄</option>
            <option value="欢快庆典">欢快庆典</option>
          </select>
        </div>
        <div class="field-group">
          <label class="lbl" for="barsSelect">长度</label>
          <select id="barsSelect">
            <option value="16">16 小节</option>
            <option value="32" selected>32 小节</option>
            <option value="64">64 小节</option>
          </select>
        </div>
      </div>
      <div class="field-group">
        <label class="lbl" for="bpmRange">速度 <span id="bpmVal" class="bpm-num">自动</span></label>
        <div class="bpm-row">
          <label class="mini"><input type="checkbox" id="bpmAuto" checked> 跟随计划</label>
          <input type="range" id="bpmRange" min="50" max="140" value="90" disabled>
        </div>
      </div>

      <div class="transport">
        <button id="playBtn" class="btn primary" type="button">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8Z" fill="currentColor"/></svg>
          <span>开始演奏</span>
        </button>
        <button id="stopBtn" class="btn" type="button" disabled>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          <span>停止</span>
        </button>
        <button id="newBtn" class="btn" type="button" disabled>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2.4"/></g><circle cx="5.6" cy="5.6" r="1.15" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1.15" fill="currentColor"/><circle cx="10.4" cy="5.6" r="1.15" fill="currentColor"/><circle cx="5.6" cy="10.4" r="1.15" fill="currentColor"/><circle cx="8" cy="8" r="1.15" fill="currentColor"/></svg>
          <span>换一版</span>
        </button>
        <button id="midiBtn" class="btn" type="button" disabled>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2.5v7M5 6.8 8 9.8l3-3M3 13h10"/></g></svg>
          <span>MIDI</span>
        </button>
        <button id="recBtn" class="btn" type="button" disabled>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="4.2" fill="currentColor"/></svg>
          <span>录音</span>
        </button>
      </div>

      <div id="planCard" class="plan-card hidden"></div>
    </section>

    <section class="right-col">
      <div class="stage reveal" style="--d:.15s">
        <div class="chordbox">
          <div class="now-chord" id="nowChord">—</div>
          <div class="now-bar" id="nowBar">准备就绪</div>
        </div>
        <canvas id="fallCanvas" height="240"></canvas>
        <div class="piano">
          <div class="fascia">
            <span class="nameplate">JEV</span>
            <span class="nameplate-sub">SYSTEM ONE IMPROVISATION</span>
          </div>
          <div class="felt"></div>
          <div id="keyboard" class="keyboard" aria-label="钢琴键盘可视化"></div>
          <div class="piano-base"></div>
        </div>
      </div>

      <section class="programme reveal" style="--d:.25s">
        <h2 class="programme-title">演奏记录 <span class="programme-sub">每小节一次 Jev 决策，六问并行</span></h2>
        <ul id="decisionLog" class="dlog"></ul>
      </section>
    </section>
  </main>

  <aside id="settingsDrawer" class="drawer hidden" aria-label="设置">
    <div class="drawer-head">
      <h2>设置</h2>
      <button id="settingsClose" class="iconbtn" type="button" aria-label="关闭">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></g></svg>
      </button>
    </div>

    <h3 class="drawer-sec">Jev 渠道</h3>
    <label class="lbl" for="channelSel">决策来源</label>
    <select id="channelSel">
      <option value="fixture" selected>离线随机（无需 key）</option>
      <option value="proxy">同源代理 /api/jev</option>
      <option value="typesafe">TypeSafe 官方直连</option>
      <option value="openrouter">OpenRouter 直连</option>
    </select>
    <label class="lbl" for="typesafeKey">TypeSafe API Key（仅存本机）</label>
    <input type="password" id="typesafeKey" placeholder="apikey_..." autocomplete="off">
    <label class="lbl" for="openrouterKey">OpenRouter API Key（仅存本机）</label>
    <input type="password" id="openrouterKey" placeholder="sk-or-..." autocomplete="off">
    <button id="testJevBtn" class="btn wfull" type="button">测试 Jev 渠道</button>

    <h3 class="drawer-sec">LLM 扩写（可选）</h3>
    <label class="mini"><input type="checkbox" id="llmEnabled"> 启用大模型把我的输入扩写成乐章计划</label>
    <label class="lbl" for="llmBaseUrl">Base URL（OpenAI 兼容端点）</label>
    <input type="text" id="llmBaseUrl" placeholder="https://api.openai.com/v1" autocomplete="off">
    <label class="lbl" for="llmModel">模型</label>
    <input type="text" id="llmModel" placeholder="gpt-4o-mini / deepseek-chat" autocomplete="off">
    <label class="lbl" for="llmKey">API Key（仅存本机）</label>
    <input type="password" id="llmKey" placeholder="sk-..." autocomplete="off">
    <label class="mini"><input type="checkbox" id="llmProxy"> 走同源代理 /api/llm</label>
    <button id="testLlmBtn" class="btn wfull" type="button">测试 LLM</button>

    <p class="hint">密钥只保存在你浏览器的 localStorage，绝不写入代码或上传。默认离线随机，无需任何账号。</p>
  </aside>

  <div id="toast" class="toast hidden"></div>

  <footer class="foot">
    <span>由 TypeSafe Jev 驱动，每小节约 $0.00005</span>
    <span class="foot-dim">架构参考 cocktailpeanut/jevthoven</span>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
